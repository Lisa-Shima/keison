spring.application.name=keison

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/keison_reservation
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger paths (optional)
springdoc.swagger-ui.path=/swagger-ui.html

# JWT config (we'll use later)
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_32+
app.jwt.expiresMinutes=120
